[project]
name = "pre-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.2",
    "lifelines==0.29.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "jsonschema==4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pre_engine"]
